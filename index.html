<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cozy Lofi & Cybertech Room • Shafaq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Minimal Discrete Audio Mute Toggle (Top Right) -->
  <button class="minimal-audio-btn" id="audio-toggle" title="Toggle Music">
    <span class="sound-wave" id="sound-wave">
      <i></i><i></i><i></i><i></i>
    </span>
  </button>

  <!-- Modern Sleek Watermark Badge (Bottom Left) -->
  <a href="https://github.com/Shafaq-codes" target="_blank" rel="noopener noreferrer" class="watermark-badge"
    title="by @shafaq-codes">
    <div class="watermark-dot-ring">
      <span class="watermark-dot"></span>
    </div>
    <div class="watermark-text-wrap">
      <span class="watermark-label">CREATED BY</span>
      <span class="watermark-name">shafaq-codes</span>
    </div>
    <div class="watermark-icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
        </path>
        <path d="M9 18c-4.51 2-5-2-7-2"></path>
      </svg>
    </div>
  </a>

  <!-- Native Background Audio Player (Direct local song.m4a file) -->
  <audio id="bg-audio" src="song.m4a" loop preload="auto"></audio>

  <!-- Click to Enter Splash Overlay -->
  <div class="enter-overlay" id="enter-overlay">
    <div class="enter-card">
      <div class="audio-icon-pulse">🎧</div>
      <h2>COZY LOFI ROOM</h2>
      <p>A quiet room, late at night, with the music on.</p>

      <div class="song-notice">
        <span class="music-icon">🎵</span>
        <span>Music: <strong>Rakhlo Tum Chupake</strong></span>
      </div>
      <button class="enter-btn" id="enter-btn">ENTER ROOM</button>
      <span class="subtext">Mouse Drag / Touchpad / Finger to look around • Scroll to zoom</span>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js?v=4"></script>
</body>

</html>
